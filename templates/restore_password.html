<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Установка нового пароля">
    <title>Новый пароль | Secret</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body class="restore_password">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="grid-h1">Новый пароль</h1>
            <p class="auth-subtitle">Придумайте новый надёжный пароль для входа</p>

            <form method="POST" action="{{ url_for('restore_password', token=token) }}" class="fromps auth-form">
                <div class="form-group">
                    <label for="pass1">Новый пароль</label>
                    <input type="password" name="password1" id="pass1" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="pass2">Повторите новый пароль</label>
                    <input type="password" name="password2" id="pass2" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <button type="submit" class="item1 btn-submit">Сохранить пароль</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('login') }}">Вернуться ко входу</a>
            </div>

            {% if message %}
            <h3 class="auth-message">{{ message }}</h3>
            {% endif %}
        </div>
    </div>
</body>
</html>
