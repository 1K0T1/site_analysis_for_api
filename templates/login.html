<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Авторизация в системе Secret">
    <title>Вход | Secret</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body class="login">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="grid-h1">Добро пожаловать!</h1>
            <p class="auth-subtitle">Введите логин и пароль для продолжения</p>

            <form action="/login" method="post" class="grid-login auth-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" placeholder="Ваш логин" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="item1 btn-submit">Войти</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('restore_gmail') }}" class="url_restore">Забыли пароль?</a>
                <span>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></span>
            </div>

            {% if message %}
            <h3 class="auth-message">{{ message }}</h3>
            {% endif %}
        </div>
    </div>
</body>
</html>
