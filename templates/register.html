<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Регистрация нового аккаунта Secret">
    <title>Регистрация | Secret</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body class="register">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="grid-h1">Регистрация</h1>
            <p class="auth-subtitle">Создайте учётную запись для доступа к платформе</p>

            <form action="/register" method="post" class="grid_register auth-form" id="registerForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" name="username" id="username" placeholder="Придумайте логин" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" name="password" id="password" placeholder="Надёжный пароль" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <input type="email" name="email" id="email" placeholder="name@example.com" required autocomplete="email">
                </div>
                
                <button type="submit" class="item1 btn-submit">Зарегистрироваться</button>
            </form>
            
            <div class="auth-footer">
                <span>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></span>
            </div>

            {% if message %}
            <h3 class="auth-message">{{ message }}</h3>
            {% endif %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='validation_reg.js') }}"></script>
</body>
</html>
